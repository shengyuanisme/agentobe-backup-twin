[workspace]
resolver = "2"
members = [
  "apps/middleware-api",
  "crates/contracts",
  "crates/simulation-engine",
  "fixtures/ticketing-rs",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = "0.8.8"
aws-config = "1.8.8"
aws-credential-types = "1.2.8"
aws-sdk-s3 = "1.108.0"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
hmac = "0.12.1"
http-body-util = "0.1.3"
jsonwebtoken = { version = "9.3.1", default-features = false, features = ["use_pem"] }
rand = "0.8.5"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["cors", "trace", "request-id"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
